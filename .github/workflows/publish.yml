# ⚠ HAND-EDITED beyond what Nuke generates. The attribute in build/Build.cs has
# AutoGenerate = false, so nothing regenerates this by itself — but running
# `nuke --generate-configuration GitHubActions_publish --host GitHubActions` WOULD overwrite it and
# silently drop the `permissions: id-token: write` block and the NuGet login step below, taking
# Trusted Publishing with them. Re-apply both by hand if you ever regenerate.

name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # request the GitHub OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 'Setup .NET'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v5
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      # Trusted Publishing: exchanges the OIDC token for a NuGet key valid ~1 hour, so no
      # long-lived secret is stored. Nuke receives it through the same NuGetApiKey parameter as
      # before, so build/Build.cs's Push target is unchanged — it neither knows nor cares that the
      # key expires. This workflow only runs on a v* tag, so there is no pull-request case to gate.
      # Requires a Trusted Publishing policy on nuget.org for PipeException naming this repository
      # and publish.yml, plus the NUGET_USER secret (the nuget.org profile name).
      - name: NuGet login (OIDC -> short-lived key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 'Run: Push'
        run: ./build.sh Push
        env:
          NuGetApiKey: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Publish: test-results'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
      - name: 'Publish: packages'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
